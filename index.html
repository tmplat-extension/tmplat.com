<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Matches the app bar's background (MUI's default primary.main for each mode; see page-shell.tsx) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1976d2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#90caf9" />
    <title>tmplat | The homepage for the tmplat browser extension</title>
    <meta
      name="description"
      content="tmplat quickly and easily copies info on the current page using a simple and unique template system."
    />
    <link rel="canonical" href="https://tmplat.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="tmplat" />
    <meta property="og:title" content="tmplat" />
    <meta
      property="og:description"
      content="Quickly and easily copies info on the current page using a simple and unique template system."
    />
    <meta property="og:url" content="https://tmplat.com/" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "tmplat",
        "applicationCategory": "BrowserApplication",
        "operatingSystem": "Chrome, Edge",
        "url": "https://tmplat.com/",
        "description": "Quickly and easily copies info on the current page using a simple and unique template system.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-home.tsx"></script>
  </body>
</html>
